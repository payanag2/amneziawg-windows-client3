name: Release MyAmneziaWG3

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create tag if it does not exist
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+(\.[0-9]+){1,3}$') {
            throw "Invalid release tag. Use a format such as v1.0.0."
          }
          git fetch --tags
          $existing = git tag --list $env:RELEASE_TAG
          if (-not $existing) {
            git tag $env:RELEASE_TAG
            git push origin $env:RELEASE_TAG
          }
          git checkout $env:RELEASE_TAG

      - name: Build application binaries
        shell: cmd
        run: build7.bat

      - name: Build MSI installers
        shell: cmd
        run: installer\\build7.bat

      - name: Verify MSI files
        shell: pwsh
        run: |
          $files = Get-ChildItem installer/dist -Filter '*.msi' -File
          if ($files.Count -eq 0) { throw 'No MSI installer files were produced.' }
          $files | ForEach-Object { Write-Host "$($_.Name) - $($_.Length) bytes" }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyAmneziaWG3-installers
          path: installer/dist/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: MyAmneziaWG3 ${{ inputs.release_tag }}
          files: installer/dist/*.msi
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: true
          draft: false
          prerelease: false
